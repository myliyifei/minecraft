<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- {{...}} 由 vite.config.ts 的 html-strings 插件从 src/ui/strings.ts 填充。 -->
    <title>{{gameTitle}}</title>
  </head>
  <body>
    <!-- 加载画面：进入世界时显示，网格建好后藏起。世界的画布与世界列表由脚本挂上。 -->
    <div id="loading" hidden>
      <h1 class="loading__title">{{gameTitle}}</h1>
      <p class="loading__status" role="status">
        {{loadingWorld}}<span class="loading__cursor" aria-hidden="true"></span>
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
